server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  # o service worker e a página nunca podem ficar presos em cache
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /config.js { add_header Cache-Control "no-cache"; }

  location /vendor/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri $uri/ =404; }
}
